server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;

    # Assets JS/CSS — cache largo (Vite genera nombres con hash)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html — sin cache (siempre fresco para que SPA funcione)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # SSE — alertas en tiempo real (sin buffer para que los eventos lleguen inmediatamente)
    location /api/v1/alerts/stream {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Crítico para SSE: deshabilitar buffering
        proxy_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no;

        # Timeout largo para conexiones SSE persistentes
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API — proxy al backend Node.js
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Para cookies httpOnly (refresh token)
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
    }

    # SPA — todas las demás rutas van a index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
